{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  {% if post %}
    <h1>Edit Post {{ post.id }}</h1>
  {% else %}
    <h1>Make a Post</h1>
  {% endif %}
</div>

<form action="" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}

  <input type="hidden" id="id_latitude" name="latitude" value="{{ form.initial.latitude }}">
  <input type="hidden" id="id_longitude" name="longitude" value="{{ form.initial.longitude }}">

  <div id="map" style="height: 400px; margin: 1em 0;"></div>

  <button type="submit" class="btn submit">Submit!</button>
</form>

<script>
  var defaultLat = parseFloat(document.getElementById("id_latitude").value) || 20;
  var defaultLng = parseFloat(document.getElementById("id_longitude").value) || 0;
  var map = L.map('map').setView([defaultLat, defaultLng], (defaultLat && defaultLng) ? 6 : 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
  }).addTo(map);

  var marker;
  if (defaultLat && defaultLng) {
    marker = L.marker([defaultLat, defaultLng]).addTo(map);
  }

  map.on('click', function(e) {
    var lat = e.latlng.lat;
    var lng = e.latlng.lng;

    document.getElementById("id_latitude").value = lat;
    document.getElementById("id_longitude").value = lng;

    if (marker) {
      marker.setLatLng(e.latlng);
    } else {
      marker = L.marker(e.latlng).addTo(map);
    }
  });
</script>
{% endblock %}
